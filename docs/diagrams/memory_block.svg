<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
<rect width="1000" height="430" fill="#f6f8fb"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#17365d">16 x 8 memory blocks</text>
<g font-family="Arial" text-anchor="middle">
<rect x="75" y="100" width="360" height="250" rx="18" fill="#eaf2f8" stroke="#4472c4" stroke-width="3"/><text x="255" y="137" font-size="22" font-weight="bold" fill="#17365d">Single-port RAM</text><text x="255" y="177" font-size="18" fill="#333">16 words x 8 bits</text><text x="255" y="210" font-size="16" fill="#333">4-bit address</text><text x="255" y="240" font-size="16" fill="#333">write enable + 8-bit data in</text><text x="255" y="270" font-size="16" fill="#333">sync write on rising clock</text><text x="255" y="300" font-size="16" fill="#333">async selected-word read</text><text x="255" y="330" font-size="15" fill="#666">No reset / init; write before read</text>
<rect x="565" y="100" width="360" height="250" rx="18" fill="#e2f0d9" stroke="#548235" stroke-width="3"/><text x="745" y="137" font-size="22" font-weight="bold" fill="#385623">ROM</text><text x="745" y="177" font-size="18" fill="#333">16 words x 8 bits</text><text x="745" y="210" font-size="16" fill="#333">4-bit address</text><text x="745" y="240" font-size="16" fill="#333">fixed documented byte table</text><text x="745" y="270" font-size="16" fill="#333">combinational lookup</text><text x="745" y="300" font-size="16" fill="#333">all addresses 0-F valid</text>
</g>
<path d="M435 210 H565" stroke="#333" stroke-width="3" stroke-dasharray="8 6"/><text x="500" y="196" font-family="Arial" font-size="15" text-anchor="middle" fill="#444">shared test address</text>
</svg>
